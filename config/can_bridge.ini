; can_bridge configuration. Place next to can_bridge.exe or pass --config.
; Every setting is optional; the values below are the built-in defaults,
; which reproduce the behaviour of the legacy SendReceiveCAN program.

[panel_port]
; Instrument panel bus: MFI, MFPU, B8-50KR, ISRP-26, SO-2010, indicators.
device = can1
; 10, 20, 50, 100, 125, 250, 500, 800 or 1000.
bitrate_kbps = 500
; SUT fault flag that reports this port: 1 = DevOtk1, 2 = DevOtk2, 0 = none.
fault_flag = 2

[overhead_port]
; Overhead panel bus: seven rows of toggle switches.
device = can2
bitrate_kbps = 500
fault_flag = 1

[timing]
; How often inputs are written to the simulator.
publish_period_ms = 20
; How often indicator values are checked and sent on change.
output_period_ms = 100
; Periodic resend of all indicator frames, 0 = only on change and reconnect.
output_refresh_period_ms = 0
; Driver timeouts. A read returns as soon as frames arrive.
read_timeout_ms = 10
write_timeout_ms = 20

[cockpit]
; What the ISRP-26 HDG knob controls:
;   left_mfi - legacy: rotation acts as the left MFI outer "ИНДИК" ring
;   isrp     - rotation and push button drive the ISRP-26 HDG fields
hdg_knob = left_mfi
; Initial "КОНТУР" backlight level, percent.
kontur_initial_percent = 75
; Compass frame: heading = data[1] * base + data[2]. 255 is what the legacy
; program sent; switch to 256 only if the controller firmware expects it.
compass_byte_base = 255

[simulator]
avn_shared_memory = STRUCT_AVN_410
sut_shared_memory = Struct_SUT

[log]
; debug, info, warning or error.
level = info
; Statistics line every N seconds, 0 = off.
stats_period_s = 0
